<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Equipamentos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- VARIÁVEIS E CORES --- */
        :root { 
            --primary: #2563eb; 
            --primary-hover: #1d4ed8;
            --bg: #f8fafc; 
            --text-main: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main);
            margin: 0;
            padding-top: 80px; 
            padding-bottom: 40px;
        }

        /* --- NAVBAR --- */
        .navbar { 
            position: fixed; top: 0; left: 0; width: 100%; height: 64px; 
            background: white; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 2rem; z-index: 1000; box-sizing: border-box; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; color: var(--primary); font-size: 1.25rem; letter-spacing: -0.5px; }
        .back-link { text-decoration: none; color: var(--text-secondary); font-size: 0.875rem; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: var(--primary); }

        /* --- LAYOUT --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        .card-style { 
            background: white; border-radius: 12px; 
            box-shadow: var(--card-shadow); border: 1px solid var(--border); 
            padding: 24px;
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .navbar { padding: 0 1rem; } }

        /* --- INPUTS --- */
        label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
        .custom-input { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--border); 
            border-radius: 8px; font-size: 0.95rem; outline: none; transition: all 0.2s; 
            background: #fff; box-sizing: border-box; color: var(--text-main); font-family: 'Inter', sans-serif;
        }
        input[type="file"]::file-selector-button { margin-right: 10px; border: none; background: var(--bg); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: 500; }
        .custom-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        textarea.custom-input { resize: vertical; min-height: 80px; margin-bottom: 20px; }

        /* --- BOTÕES --- */
        .btn-primary { 
            background-color: var(--primary); color: white; padding: 12px 20px; 
            border: none; border-radius: 8px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: background 0.2s; font-size: 1rem; 
        }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-cancel {
            background-color: #94a3b8; color: white; margin-top: 10px;
        }
        .btn-cancel:hover { background-color: #64748b; }

        .btn-secondary { background-color: white; color: var(--primary); border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-secondary:hover { background-color: #eff6ff; border-color: var(--primary); }

        /* --- GRID E CARDS --- */
        .grid-equipamentos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .item-card { 
            background: white; border-radius: 12px; border: 1px solid var(--border); 
            padding: 15px; transition: all 0.2s; display: flex; flex-direction: column; 
            position: relative;
        }
        .item-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        .item-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; background-color: #f1f5f9; cursor: pointer; }
        .item-card h4 { margin: 0 0 8px 0; font-size: 1rem; font-weight: 600; color: var(--text-main); }

        /* Botoes de Ação no Card */
        .card-actions {
            display: flex; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f1f5f9;
        }
        .action-btn {
            flex: 1; padding: 6px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s;
        }
        .btn-edit { background: #eff6ff; color: var(--primary); }
        .btn-edit:hover { background: #dbeafe; }
        .btn-delete { background: #fef2f2; color: var(--danger); }
        .btn-delete:hover { background: #fee2e2; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; width: 90%; max-width: 500px; border-radius: 16px; position: relative; }
        .close { position: absolute; top: 20px; right: 25px; font-size: 28px; cursor: pointer; color: var(--text-secondary); line-height: 1; }
        .modal-img { width: 100%; max-height: 300px; object-fit: contain; background: #f8fafc; border-radius: 8px; margin-bottom: 20px; }
        
        #status { font-weight: 600; margin-top: 15px; font-size: 0.9rem; text-align: center; min-height: 20px;}
        .load-more-container { text-align: center; padding: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand"><span>⚙️</span> MECÂNICA APP</div>
        <a href="../principal.html" class="back-link">&larr; Voltar ao Início</a>
    </nav>

    <div class="container">
        
        <div class="card-style">
            <h3 id="formTitulo" style="margin-top: 0; margin-bottom: 24px; color: var(--text-main); font-size: 1.1rem;">Cadastrar Novo Equipamento</h3>
            
            <div class="form-grid">
                <div>
                    <label>Nome do Equipamento</label>
                    <input type="text" id="nome" class="custom-input" placeholder="Ex: CLP Siemens S7-1200">
                </div>
                <div>
                    <label>Foto <span id="fotoLabel" style="font-weight: normal; font-size: 0.8em;">(Opcional na edição)</span></label>
                    <input type="file" id="fotoInput" class="custom-input" accept="image/*" style="padding: 7px;">
                </div>
            </div>

            <label>Especificações Técnicas</label>
            <textarea id="specs" class="custom-input" placeholder="Detalhes técnicos..."></textarea>

            <button onclick="salvarEquipamento()" id="btnSalvar" class="btn-primary">Adicionar Equipamento</button>
            <button onclick="cancelarEdicao()" id="btnCancelar" class="btn-primary btn-cancel" style="display: none;">Cancelar Edição</button>
            <p id="status"></p>
        </div>

        <div style="margin: 40px 0 20px 0; display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">Inventário</h3>
            <input type="text" id="inputBusca" class="custom-input" style="width: 250px; margin:0;" placeholder="🔍 Filtrar itens..." onkeyup="filtrarEquipamentos()">
        </div>

        <div id="lista" class="grid-equipamentos"></div>

        <div class="load-more-container">
            <button id="btnCarregarMais" onclick="carregarProximos()" class="btn-secondary" style="display: none;">Carregar Mais</button>
            <p id="msgFim" style="color: #64748b; display: none; font-size: 0.9rem;">Todos os itens carregados.</p>
        </div>
    </div>

    <div id="modalDetalhes" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h3 id="modalTitulo"></h3>
            <img id="modalImagem" class="modal-img" src="" alt="Foto">
            <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid var(--border);">
                <label>Especificações:</label>
                <p id="modalSpecs" style="margin: 0; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6;"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // Importamos 'doc', 'deleteDoc' e 'updateDoc' para gerenciar edição e exclusão
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, startAfter, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwBdNKVmujXM-icPXZllCYw4ED6ugSEK0",
            authDomain: "mecanica-699bb.firebaseapp.com",
            projectId: "mecanica-699bb",
            messagingSenderId: "223675812288",
            appId: "1:223675812288:web:f91f3dab6705fa7a2aa025",
            measurementId: "G-G78PR55F9F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // VARIÁVEIS GLOBAIS
        let ultimoDocCarregado = null;
        const ITENS_POR_PAGINA = 4;
        let carregando = false;
        
        // Variável que guarda o ID se estivermos editando (se for null, é criação nova)
        let idEdicao = null; 
        let fotoUrlAtual = ""; // Guarda a foto antiga durante a edição

        const converterParaBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        // --- FUNÇÃO INTELIGENTE DE SALVAR (CRIA OU EDITA) ---
        window.salvarEquipamento = async function() {
            const nome = document.getElementById('nome').value;
            const specs = document.getElementById('specs').value;
            const fileInput = document.getElementById('fotoInput');
            const file = fileInput.files[0];
            const btn = document.getElementById('btnSalvar');
            const status = document.getElementById('status');

            // Validação Básica
            if (!nome) { alert("Preencha o nome!"); return; }
            
            // Se NÃO estiver editando, exige foto. Se estiver editando, foto é opcional.
            if (!idEdicao && !file) { alert("Escolha uma foto!"); return; }

            if (file && file.size > 700 * 1024) { alert("Foto muito grande! Use < 700KB."); return; }

            try {
                btn.disabled = true;
                btn.innerText = idEdicao ? "Atualizando..." : "Salvando...";
                status.innerText = "";
                
                let fotoFinal = fotoUrlAtual; // Assume a foto antiga por padrão

                // Se o usuário selecionou uma NOVA foto, converte ela
                if (file) {
                    fotoFinal = await converterParaBase64(file);
                }

                const dados = {
                    nome: nome,
                    specs: specs,
                    fotoUrl: fotoFinal,
                    nomeBusca: nome.toLowerCase(),
                    dataCriacao: new Date() // Atualiza data para subir na lista
                };

                if (idEdicao) {
                    // --- MODO EDIÇÃO ---
                    const docRef = doc(db, "equipamentos", idEdicao);
                    await updateDoc(docRef, dados);
                    status.style.color = "blue";
                    status.innerText = "Atualizado com sucesso!";
                    cancelarEdicao(); // Sai do modo edição
                } else {
                    // --- MODO CRIAÇÃO ---
                    await addDoc(collection(db, "equipamentos"), dados);
                    status.style.color = "green";
                    status.innerText = "Salvo com sucesso!";
                    limparFormulario();
                }

                resetarLista();

            } catch (error) {
                console.error("Erro:", error);
                status.innerText = "Erro ao salvar.";
            } finally {
                btn.disabled = false;
                if (!idEdicao) btn.innerText = "Adicionar Equipamento";
                setTimeout(() => status.innerText = "", 3000);
            }
        }

        // --- PREPARAR PARA EDITAR ---
        window.editarItem = function(id, nome, specs, fotoUrl) {
            // Sobe a tela suavemente
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Preenche os campos
            document.getElementById('nome').value = nome;
            document.getElementById('specs').value = specs;
            
            // Configura variáveis globais
            idEdicao = id;
            fotoUrlAtual = fotoUrl;

            // Muda visual do formulário
            document.getElementById('formTitulo').innerText = "Editando: " + nome;
            document.getElementById('btnSalvar').innerText = "Salvar Alterações";
            document.getElementById('btnSalvar').style.backgroundColor = "#f59e0b"; // Cor amarela/laranja para destaque
            document.getElementById('btnCancelar').style.display = "block";
            document.getElementById('fotoLabel').innerText = "(Deixe vazio para manter a foto atual)";
        }

        window.cancelarEdicao = function() {
            idEdicao = null;
            fotoUrlAtual = "";
            limparFormulario();
            document.getElementById('formTitulo').innerText = "Cadastrar Novo Equipamento";
            document.getElementById('btnSalvar').innerText = "Adicionar Equipamento";
            document.getElementById('btnSalvar').style.backgroundColor = ""; // Volta a cor original
            document.getElementById('btnCancelar').style.display = "none";
            document.getElementById('fotoLabel').innerText = "(Opcional na edição)";
        }

        // --- EXCLUIR ---
        window.excluirItem = async function(id, nome) {
            if (confirm(`Tem certeza que deseja excluir o item "${nome}"?`)) {
                try {
                    await deleteDoc(doc(db, "equipamentos", id));
                    alert("Item excluído!");
                    resetarLista();
                } catch (error) {
                    console.error(error);
                    alert("Erro ao excluir.");
                }
            }
        }

        // --- CARREGAMENTO ---
        window.carregarProximos = async function() {
            if (carregando) return;
            carregando = true;
            
            const btnMais = document.getElementById('btnCarregarMais');
            const msgFim = document.getElementById('msgFim');
            
            if(btnMais) btnMais.innerText = "Carregando...";

            try {
                let q;
                const colRef = collection(db, "equipamentos");
                
                if (!ultimoDocCarregado) {
                    q = query(colRef, orderBy("dataCriacao", "desc"), limit(ITENS_POR_PAGINA));
                } else {
                    q = query(colRef, orderBy("dataCriacao", "desc"), startAfter(ultimoDocCarregado), limit(ITENS_POR_PAGINA));
                }

                const snapshot = await getDocs(q);
                
                if (snapshot.empty) {
                    if(btnMais) btnMais.style.display = "none";
                    if(msgFim) msgFim.style.display = "block";
                    carregando = false;
                    return;
                }

                ultimoDocCarregado = snapshot.docs[snapshot.docs.length - 1];

                snapshot.forEach((docSnap) => {
                    // Passamos o ID e os DADOS para criar o card
                    criarCard(docSnap.id, docSnap.data());
                });

                if (snapshot.docs.length < ITENS_POR_PAGINA) {
                    if(btnMais) btnMais.style.display = "none";
                    if(msgFim) msgFim.style.display = "block";
                } else {
                    if(btnMais) {
                        btnMais.style.display = "inline-block";
                        btnMais.innerText = "Carregar Mais";
                    }
                }

            } catch (error) {
                console.error("Erro ao carregar:", error);
            } finally {
                carregando = false;
            }
        }

        function resetarLista() {
            document.getElementById('lista').innerHTML = '';
            document.getElementById('msgFim').style.display = 'none';
            document.getElementById('btnCarregarMais').style.display = 'none';
            ultimoDocCarregado = null;
            carregarProximos();
        }

        function criarCard(id, data) {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.setAttribute('data-nome', data.nome.toLowerCase());
            
            // Precisamos escapar as aspas para não quebrar o HTML no onclick
            const safeNome = data.nome.replace(/"/g, '&quot;');
            const safeSpecs = (data.specs || "").replace(/"/g, '&quot;');
            
            div.innerHTML = `
                <img src="${data.fotoUrl}" onclick='abrirModal(${JSON.stringify(data)})' alt="${data.nome}">
                <h4 onclick='abrirModal(${JSON.stringify(data)})' style="cursor:pointer">${data.nome}</h4>
                
                <div class="card-actions">
                    <button class="action-btn btn-edit" onclick='editarItem("${id}", "${safeNome}", "${safeSpecs}", "${data.fotoUrl}")'>Editar</button>
                    <button class="action-btn btn-delete" onclick='excluirItem("${id}", "${safeNome}")'>Excluir</button>
                </div>
            `;
            document.getElementById('lista').appendChild(div);
        }

        window.filtrarEquipamentos = function() {
            const termo = document.getElementById('inputBusca').value.toLowerCase();
            const cards = document.getElementsByClassName('item-card');
            for (let card of cards) {
                const nome = card.getAttribute('data-nome');
                card.style.display = nome.includes(termo) ? "flex" : "none";
            }
        }

        function limparFormulario() {
            document.getElementById('nome').value = '';
            document.getElementById('specs').value = '';
            document.getElementById('fotoInput').value = '';
        }

        // MODAL
        window.abrirModal = (data) => {
            document.getElementById('modalTitulo').innerText = data.nome;
            document.getElementById('modalSpecs').innerText = data.specs || "Sem especificações.";
            document.getElementById('modalImagem').src = data.fotoUrl;
            document.getElementById('modalDetalhes').style.display = "flex";
        }
        window.fecharModal = () => document.getElementById('modalDetalhes').style.display = "none";
        window.onclick = (e) => { if(e.target == document.getElementById('modalDetalhes')) fecharModal(); }

        // Inicializa
        carregarProximos();

    </script>
</body>
</html>
