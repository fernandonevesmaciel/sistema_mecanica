<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ Ferramentas App - Mecânica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --primary: #10b981; --border: #e2e8f0; } /* Verde Esmeralda */
        .navbar { position: fixed; top: 0; left: 0; width: 100%; height: 64px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; box-sizing: border-box; z-index: 1000; }
        body { padding-top: 85px; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .ultrapassou { color: #ef4444 !important; }
        .alerta-animado { animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen px-4 pb-12">
    <nav class="navbar shadow-sm">
        <div class="flex items-center gap-2" style="font-weight: 800; color: var(--primary); font-size: 1.25rem;"><span>🛠️</span> FERRAMENTAS - MECÂNICA</div>
        <a href="../principal.html" class="text-slate-500 hover:text-emerald-600 font-semibold text-sm transition-colors tracking-tighter uppercase">Voltar ao Início</a>
    </nav>

    <div class="max-w-6xl mx-auto">
        <div class="bg-white p-5 rounded-2xl shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between border border-slate-200">
            <div>
                <h1 class="text-xl font-extrabold text-slate-800 tracking-tight text-emerald-600 uppercase">Lista de Compras - Ferramentas</h1>
                <p class="text-[10px] text-green-500 font-bold uppercase tracking-wider">● Sincronização Automática para Compras</p>
            </div>
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex flex-col">
                    <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Meta deste Mês</label>
                    <input type="text" id="limiteOrcamento" disabled oninput="aplicarMascara(this)" class="bg-slate-100 px-3 py-2 rounded-xl border border-slate-200 font-bold text-slate-700 outline-none focus:ring-2 focus:ring-emerald-400 w-48 text-right disabled:opacity-50 disabled:cursor-not-allowed">
                </div>
                <div class="flex items-center gap-2 bg-slate-100 p-2 rounded-xl border border-slate-200">
                    <select id="selectMes" onchange="trocarPeriodo()" class="bg-transparent px-2 font-bold text-slate-700 outline-none">
                        <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                    </select>
                    <select id="selectAno" onchange="trocarPeriodo()" class="bg-transparent px-2 font-bold text-slate-700 outline-none">
                        <option value="2025">2025</option><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                <h2 class="text-xs font-bold mb-4 text-slate-400 uppercase tracking-widest">Pesquisar Ferramenta</h2>
                <input type="text" id="inputBusca" oninput="monitorarBusca(this.value)" placeholder="Digite nome ou código..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-400 mb-4 transition-all">
                <div id="listaSugestoes" class="space-y-3 max-h-[500px] overflow-y-auto pr-2 custom-scroll"></div>
            </div>

            <div class="lg:col-span-7 bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden flex flex-col h-fit">
                <div class="bg-slate-800 p-4 flex justify-between items-center shrink-0">
                    <h2 class="text-white font-bold text-xs uppercase tracking-widest" id="labelPeriodo">Carregando...</h2>
                    <div class="flex items-center gap-2">
                        <button id="btnGerarPDF" onclick="window.exportarPDF()" class="bg-red-600 hover:bg-red-700 text-white text-[10px] font-bold py-1.5 px-3 rounded-lg shadow-sm">GERAR PDF</button>
                        <button onclick="window.exportarLibreOffice()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold py-1.5 px-3 rounded-lg shadow-sm">GERAR PLANILHA</button>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 border-b flex justify-between items-center shrink-0">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Subtotal Acumulado</span>
                        <span id="totalPreco" class="text-2xl font-black text-slate-800 tracking-tighter transition-all">R$ 0,00</span>
                    </div>
                    <div id="alertaLimite" class="hidden bg-red-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase alerta-animado">⚠️ Limite Excedido</div>
                </div>
                <ul id="listaComprasUI" class="divide-y divide-slate-100 overflow-y-auto max-h-[450px] custom-scroll min-h-[300px]"></ul>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, addDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ================= CONFIGURAÇÕES FIREBASE (MECÂNICA) =================
        const firebaseConfigMecanica = {
            apiKey: "AIzaSyAwBdNKVmujXM-icPXZllCYw4ED6ugSEK0",
            authDomain: "mecanica-699bb.firebaseapp.com",
            projectId: "mecanica-699bb",
            messagingSenderId: "223675812288",
            appId: "1:223675812288:web:f91f3dab6705fa7a2aa025",
            measurementId: "G-G78PR55F9F"
        };

        const firebaseConfigEletrica = {
            apiKey: "AIzaSyB_w4-z_onAEUf10ROfYCmvnm6Fkkp2sYo",
            authDomain: "eletrica-8c96e.firebaseapp.com",
            projectId: "eletrica-8c96e",
            storageBucket: "eletrica-8c96e.firebasestorage.app",
            messagingSenderId: "456815528430",
            appId: "1:456815528430:web:4cf873dc8071c9a2bbe6ff"
        };

        const app = initializeApp(firebaseConfigMecanica);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const appEletrica = initializeApp(firebaseConfigEletrica, "appEletrica");
        const dbEletrica = getFirestore(appEletrica);

        const ADMIN_IDS = [
            "0dN2teZrTkYkg26rBrKcEDpy5El1",
            "kBGhpXomEbcn8aqxrvQr1z4hWz22"
        ];
        let isUserAdmin = false;

        onAuthStateChanged(auth, (user) => {
            if (user && ADMIN_IDS.includes(String(user.uid).trim())) {
                isUserAdmin = true;
                const inputMeta = document.getElementById('limiteOrcamento');
                if (inputMeta) inputMeta.removeAttribute('disabled');
            } else {
                isUserAdmin = false;
                const inputMeta = document.getElementById('limiteOrcamento');
                if (inputMeta) inputMeta.setAttribute('disabled', 'true');
            }
        });

        let todosProdutos = [];
        let carrinhoAtual = [];
        let periodoId = "";
        let somaTotalGlobal = 0;
        let valorLimiteDesteMes = 0;
        let editandoItemId = null;

        async function init() {
            const snap = await getDocs(collection(db, "produtos"));
            todosProdutos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const d = new Date();
            document.getElementById('selectMes').value = String(d.getMonth() + 1).padStart(2, '0');
            document.getElementById('selectAno').value = d.getFullYear();
            trocarPeriodo();
        }

        window.aplicarMascara = (campo) => {
            let v = campo.value.replace(/\D/g, "");
            v = (v / 100).toFixed(2) + "";
            v = v.replace(".", ",");
            v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
            campo.value = "R$ " + v;
            valorLimiteDesteMes = parseFloat(campo.value.replace(/[R$\s.]/g, "").replace(",", "."));
            salvarMetaNoBanco();
        };

        async function salvarMetaNoBanco() {
            if (!isUserAdmin) return; 
            await setDoc(doc(db, "listas_mensais_ferramentas", periodoId), { itens: carrinhoAtual, meta: valorLimiteDesteMes }, { merge: true });
        }

        window.trocarPeriodo = () => {
            const mes = document.getElementById('selectMes').value;
            const ano = document.getElementById('selectAno').value;
            periodoId = `${mes}-${ano}`;
            const mesNome = document.getElementById('selectMes').options[document.getElementById('selectMes').selectedIndex].text;
            document.getElementById('labelPeriodo').innerText = `Orçamento Ferramentas: ${mesNome} / ${ano}`;
            editandoItemId = null;

            onSnapshot(doc(db, "listas_mensais_ferramentas", periodoId), (docSnap) => {
                if (docSnap.exists()) {
                    const dados = docSnap.data();
                    carrinhoAtual = (dados.itens || []).map((it, idx) => ({
                        ...it,
                        itemId: it.itemId || `${it.id}_${idx}_${Date.now()}`
                    }));
                    valorLimiteDesteMes = dados.meta !== undefined ? dados.meta : 0;
                } else {
                    carrinhoAtual = []; valorLimiteDesteMes = 0;
                }
                const input = document.getElementById('limiteOrcamento');
                if (document.activeElement !== input) {
                    input.value = (valorLimiteDesteMes || 0).toLocaleString('pt-br', { style: 'currency', currency: 'BRL' });
                }
                renderizarCarrinho();
                monitorarBusca(document.getElementById('inputBusca').value);
            });
        };

        window.monitorarBusca = (termo) => {
            const lista = document.getElementById('listaSugestoes');
            if (termo.length < 2) { lista.innerHTML = ""; return; }
            const filtrados = todosProdutos.filter(p => (p.codigo && String(p.codigo).includes(termo)) || (p.nome && p.nome.toLowerCase().includes(termo.toLowerCase())));
            
            lista.innerHTML = filtrados.map(p => {
                return `
                <div class="p-4 border rounded-2xl bg-white shadow-sm border-slate-100 flex flex-col gap-2 transition-all hover:border-emerald-200">
                    <p class="font-bold text-slate-800 text-sm leading-tight">${p.nome}</p>
                    <p class="text-[10px] text-slate-400 font-mono font-bold uppercase tracking-tighter">Cód: ${p.codigo} | Unit: R$ ${p.valor}</p>
                    
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-1">
                        <select id="semana-${p.id}" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400" title="Semana do Mês">
                            <option value="">Semana (Op.)</option>
                            <option value="1ª Semana">1ª Semana</option>
                            <option value="2ª Semana">2ª Semana</option>
                            <option value="3ª Semana">3ª Semana</option>
                            <option value="4ª Semana">4ª Semana</option>
                            <option value="5ª Semana">5ª Semana</option>
                        </select>
                        <input type="date" id="dataDesejada-${p.id}" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400" title="Data Desejada">
                        <input type="text" id="local-${p.id}" placeholder="Local (ex: Oficina)" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                        <input type="text" id="nimbi-${p.id}" placeholder="Cód. Nimbi" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                        <input type="text" id="movimentacao-${p.id}" placeholder="Cód. Mov." class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                    </div>

                    <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-50">
                        <input type="number" id="qtd-${p.id}" value="1" min="1" class="w-16 p-2 bg-slate-100 border rounded-lg text-sm font-bold text-center outline-none">
                        <button onclick="adicionar('${p.id}')" class="flex-1 py-2 rounded-xl text-[10px] font-black uppercase shadow-md bg-emerald-600 text-white hover:bg-emerald-700 shadow-emerald-100">＋ Adicionar à Lista</button>
                    </div>
                </div>`;
            }).join('');
        };

        window.adicionar = async (id) => {
            const prod = todosProdutos.find(p => p.id === id);
            const qtd = parseInt(document.getElementById(`qtd-${id}`).value) || 1;
            const semana = document.getElementById(`semana-${id}`).value || "";
            const dataDes = document.getElementById(`dataDesejada-${id}`).value || "";
            const localUso = document.getElementById(`local-${id}`).value || "Geral";
            const codNimbi = document.getElementById(`nimbi-${id}`).value || "";
            const codMov = document.getElementById(`movimentacao-${id}`).value || "";
            const valorUnit = parseFloat(String(prod.valor).replace(',', '.'));
            
            // Cada adição gera um itemId único para permitir o mesmo produto repetido com Nimbi ou semana diferente
            const novoItem = {
                ...prod,
                itemId: Date.now() + "_" + Math.random().toString(36).substring(2, 7),
                quantidade: qtd,
                semanaMes: semana,
                dataDesejada: dataDes,
                local: localUso,
                codigoNimbi: codNimbi,
                codigoMovimentacao: codMov
            };

            const novaLista = [...carrinhoAtual, novoItem];
            await setDoc(doc(db, "listas_mensais_ferramentas", periodoId), { itens: novaLista, meta: valorLimiteDesteMes }, { merge: true });

            await addDoc(collection(db, "compras"), {
                nome: prod.nome,
                codigo: prod.codigo || "S/C",
                codigoNimbi: codNimbi,
                codigoMovimentacao: codMov,
                local: localUso,
                origem: "Ferramentas",
                semanaMes: semana,
                quantidade: qtd,
                dataDesejada: dataDes,
                valorUnitario: valorUnit,
                valorTotal: valorUnit * qtd,
                data: new Date().toISOString().split('T')[0],
                status: "solicitacao",
                observacao: `Nimbi: ${codNimbi} | Mov: ${codMov}${semana ? ' | ' + semana : ''}`,
                dataCriacao: new Date()
            });

            const elNimbi = document.getElementById(`nimbi-${id}`);
            if (elNimbi) elNimbi.value = "";
        };

        window.remover = async (itemId) => {
            const novaLista = carrinhoAtual.filter(i => (i.itemId || i.id) !== itemId);
            await setDoc(doc(db, "listas_mensais_ferramentas", periodoId), { itens: novaLista, meta: valorLimiteDesteMes }, { merge: true });
        };

        window.editar = (itemId) => {
            editandoItemId = itemId;
            renderizarCarrinho();
        };

        window.cancelarEdicao = () => {
            editandoItemId = null;
            renderizarCarrinho();
        };

        window.salvarEdicao = async (itemId) => {
            const index = carrinhoAtual.findIndex(i => (i.itemId || i.id) === itemId);
            if (index !== -1) {
                const novaQtd = parseInt(document.getElementById(`edit-qtd-${itemId}`).value) || 1;
                const novaSemana = document.getElementById(`edit-semana-${itemId}`).value || "";
                const novaDataDes = document.getElementById(`edit-dataDes-${itemId}`).value || "";
                const novoLocal = document.getElementById(`edit-local-${itemId}`).value || "Geral";
                const novoNimbi = document.getElementById(`edit-nimbi-${itemId}`).value || "";
                const novoMov = document.getElementById(`edit-mov-${itemId}`).value || "";

                carrinhoAtual[index].quantidade = novaQtd;
                carrinhoAtual[index].semanaMes = novaSemana;
                carrinhoAtual[index].dataDesejada = novaDataDes;
                carrinhoAtual[index].local = novoLocal;
                carrinhoAtual[index].codigoNimbi = novoNimbi;
                carrinhoAtual[index].codigoMovimentacao = novoMov;

                editandoItemId = null;
                renderizarCarrinho();

                await setDoc(doc(db, "listas_mensais_ferramentas", periodoId), { itens: carrinhoAtual, meta: valorLimiteDesteMes }, { merge: true });
            }
        };

        window.exportarPDF = async () => {
            const btn = document.getElementById('btnGerarPDF');
            const textoOriginal = btn.innerText;
            btn.innerText = "GERANDO..."; 

            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();
            const mesRef = document.getElementById('selectMes').options[document.getElementById('selectMes').selectedIndex].text;
            const anoRef = document.getElementById('selectAno').value;

            let itensParaRelatorio = carrinhoAtual.map(i => ({...i, origem: "Ferramentas"}));
            let metaEletrica = 0;

            if (isUserAdmin) {
                try {
                    const docRef = doc(dbEletrica, "listas_mensais_ferramentas", periodoId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const dadosEle = docSnap.data();
                        const itensEle = dadosEle.itens || [];
                        metaEletrica = dadosEle.meta || 0;
                        itensEle.forEach(i => i.origem = "Elétrica");
                        itensParaRelatorio = [...itensParaRelatorio, ...itensEle];
                    }
                } catch (erro) {
                    console.error("Erro ao buscar dados da Elétrica para o PDF:", erro);
                }
            }

            const gruposNimbi = {};
            const totaisMovimentacao = {}; 
            
            itensParaRelatorio.forEach(item => {
                const nimbi = (item.codigoNimbi || "").trim() || "Sem Código Nimbi";
                if (!gruposNimbi[nimbi]) gruposNimbi[nimbi] = { itens: [], subtotal: 0 };
                gruposNimbi[nimbi].itens.push(item);
                
                const vUnit = parseFloat(String(item.valor).replace(',', '.')) || 0;
                const qtd = parseInt(item.quantidade) || 1;
                const totalLinha = vUnit * qtd;

                gruposNimbi[nimbi].subtotal += totalLinha;

                const mov = (item.codigoMovimentacao || "").trim() || "Sem Cód. Mov.";
                if (!totaisMovimentacao[mov]) totaisMovimentacao[mov] = 0;
                totaisMovimentacao[mov] += totalLinha;
            });

            docPdf.setFontSize(14);
            docPdf.text(`Relatório de Compras (Ferramentas): ${mesRef} / ${anoRef}`, 14, 15);
            
            if(isUserAdmin) {
                docPdf.setFontSize(9);
                docPdf.setTextColor(100, 100, 100);
                docPdf.text(`(Contempla dados unificados de Mecânica e Elétrica)`, 14, 20);
                docPdf.setTextColor(0, 0, 0);
            }

            let currentY = isUserAdmin ? 25 : 22;
            let gastoTotalSomado = 0;
            const chavesOrdenadas = Object.keys(gruposNimbi).sort();

            for (const nimbi of chavesOrdenadas) {
                const grupo = gruposNimbi[nimbi];
                if (currentY > 260) { docPdf.addPage(); currentY = 20; }

                docPdf.setFontSize(11);
                docPdf.setFont(undefined, 'bold');
                docPdf.setTextColor(16, 185, 129); 
                docPdf.text(`Cód Nimbi: ${nimbi}`, 14, currentY);
                docPdf.setTextColor(0, 0, 0); 
                currentY += 5;

                const colunas = ["Cód", "Mov", "Produto", "Semana", "Local", "Qtd", "Unit", "Total"];
                if (isUserAdmin) colunas.push("Origem");

                const linhas = grupo.itens.map(item => {
                    const vUnit = parseFloat(String(item.valor).replace(',', '.')) || 0;
                    const totalLinha = vUnit * item.quantidade;
                    
                    const row = [
                        item.codigo || "-", 
                        item.codigoMovimentacao || "-", 
                        item.nome, 
                        item.semanaMes || "-",
                        item.local || "Geral", 
                        item.quantidade, 
                        `R$ ${vUnit.toFixed(2).replace('.', ',')}`, 
                        `R$ ${totalLinha.toFixed(2).replace('.', ',')}`
                    ];
                    if (isUserAdmin) row.push(item.origem);
                    return row;
                });

                docPdf.autoTable({ 
                    head: [colunas], 
                    body: linhas, 
                    startY: currentY,
                    theme: 'striped',
                    headStyles: { fillColor: [16, 185, 129] }, 
                    styles: { fontSize: 8 },
                    margin: { bottom: 15 } 
                });

                currentY = docPdf.lastAutoTable.finalY + 6;
                docPdf.setFontSize(10);
                docPdf.setFont(undefined, 'bold');
                docPdf.text(`Cód Nimbi ${nimbi} Valor R$ ${grupo.subtotal.toFixed(2).replace('.', ',')}`, 14, currentY);
                
                currentY += 12; 
                gastoTotalSomado += grupo.subtotal;
            }

            const chavesMov = Object.keys(totaisMovimentacao).sort();
            let alturaResumoBase = isUserAdmin ? 35 : 20; 
            let alturaSessaoMovimentos = 15 + (chavesMov.length * 5); 
            let alturaTotalBox = alturaResumoBase + alturaSessaoMovimentos;

            if (currentY + alturaTotalBox > 280) { docPdf.addPage(); currentY = 20; }

            docPdf.setFillColor(241, 245, 249); 
            docPdf.rect(14, currentY - 5, 180, alturaTotalBox, 'F');
            docPdf.setFontSize(11);
            docPdf.setFont(undefined, 'bold');
            docPdf.text(`RESUMO GERAL DO MÊS`, 18, currentY + 2);
            currentY += 10;
            
            docPdf.setFontSize(10);
            docPdf.setFont(undefined, 'normal');
            docPdf.text(`Total de Compras Solicitadas: R$ ${gastoTotalSomado.toFixed(2).replace('.', ',')}`, 18, currentY);
            currentY += 5;
            docPdf.text(`Meta (Mecânica): R$ ${valorLimiteDesteMes.toFixed(2).replace('.', ',')}`, 18, currentY);
            
            if (isUserAdmin) {
                currentY += 5;
                docPdf.text(`Meta (Elétrica): R$ ${metaEletrica.toFixed(2).replace('.', ',')}`, 18, currentY);
                currentY += 5;
                docPdf.setFont(undefined, 'bold');
                docPdf.text(`Meta Total Unificada: R$ ${(valorLimiteDesteMes + metaEletrica).toFixed(2).replace('.', ',')}`, 18, currentY);
            }

            currentY += 10;
            docPdf.setFontSize(10);
            docPdf.setFont(undefined, 'bold');
            docPdf.text(`TOTAL GASTO POR CÓDIGO DE MOVIMENTAÇÃO:`, 18, currentY);
            currentY += 6;
            docPdf.setFontSize(9);
            docPdf.setFont(undefined, 'normal');
            
            chavesMov.forEach(mov => {
                docPdf.text(`- Cód Mov: ${mov} -> R$ ${totaisMovimentacao[mov].toFixed(2).replace('.', ',')}`, 18, currentY);
                currentY += 5;
            });

            docPdf.save(`Orcamento_Ferramentas_${mesRef}_${anoRef}.pdf`);
            btn.innerText = textoOriginal;
        };

        window.exportarLibreOffice = () => {
            if (carrinhoAtual.length === 0) return alert("Adicione itens antes de exportar!");

            const mesRef = document.getElementById('selectMes').options[document.getElementById('selectMes').selectedIndex].text;
            const anoRef = document.getElementById('selectAno').value;

            const dadosExcel = carrinhoAtual.map(item => {
                const vUnit = parseFloat(String(item.valor).replace(',', '.'));
                return {
                    "Código": item.codigo || "S/C",
                    "Cód. Nimbi": item.codigoNimbi || "",
                    "Cód. Mov.": item.codigoMovimentacao || "",
                    "Semana de Compra": item.semanaMes || "",
                    "Data Desejada": item.dataDesejada || "",
                    "Descrição do Produto": item.nome,
                    "Local de Aplicação": item.local || "Geral",
                    "Qtd": item.quantidade,
                    "Valor Unitário": vUnit,
                    "Valor Total": vUnit * item.quantidade
                };
            });

            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(dadosExcel);
            ws['!cols'] = [{ wch: 15 }, { wch: 15 }, { wch: 15 }, { wch: 16 }, { wch: 15 }, { wch: 45 }, { wch: 20 }, { wch: 8 }, { wch: 15 }, { wch: 15 }];
            XLSX.utils.book_append_sheet(wb, ws, "Orcamento");
            XLSX.writeFile(wb, `Orcamento_Ferramentas_${mesRef}_${anoRef}.xlsx`);
        };

        function renderizarCarrinho() {
            const ui = document.getElementById('listaComprasUI');
            somaTotalGlobal = 0;
            if (carrinhoAtual.length === 0) {
                ui.innerHTML = `<div class="py-24 text-center text-slate-300 font-bold text-[10px] uppercase tracking-widest">Nenhum Item Adicionado</div>`;
                document.getElementById('totalPreco').innerText = "R$ 0,00";
                validarLimite();
                return;
            }
            ui.innerHTML = carrinhoAtual.map(p => {
                const itemChave = p.itemId || p.id;
                const totalLinha = (parseFloat(String(p.valor).replace(',', '.')) || 0) * (p.quantidade || 1);
                somaTotalGlobal += totalLinha;
                
                if (editandoItemId === itemChave) {
                    return `
                    <li class="p-4 bg-emerald-50 border-b border-emerald-100 flex flex-col gap-2">
                        <p class="text-sm font-bold text-emerald-800 leading-tight">Editando: ${p.nome}</p>
                        <div class="grid grid-cols-2 md:grid-cols-6 gap-2 mt-1">
                            <select id="edit-semana-${itemChave}" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                                <option value="" ${!p.semanaMes ? 'selected' : ''}>Sem Semana</option>
                                <option value="1ª Semana" ${p.semanaMes === '1ª Semana' ? 'selected' : ''}>1ª Semana</option>
                                <option value="2ª Semana" ${p.semanaMes === '2ª Semana' ? 'selected' : ''}>2ª Semana</option>
                                <option value="3ª Semana" ${p.semanaMes === '3ª Semana' ? 'selected' : ''}>3ª Semana</option>
                                <option value="4ª Semana" ${p.semanaMes === '4ª Semana' ? 'selected' : ''}>4ª Semana</option>
                                <option value="5ª Semana" ${p.semanaMes === '5ª Semana' ? 'selected' : ''}>5ª Semana</option>
                            </select>
                            <input type="date" id="edit-dataDes-${itemChave}" value="${p.dataDesejada || ''}" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                            <input type="text" id="edit-local-${itemChave}" value="${p.local || ''}" placeholder="Local" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                            <input type="text" id="edit-nimbi-${itemChave}" value="${p.codigoNimbi || ''}" placeholder="Cód. Nimbi" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                            <input type="text" id="edit-mov-${itemChave}" value="${p.codigoMovimentacao || ''}" placeholder="Cód. Mov." class="w-full p-2 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold outline-none focus:ring-1 focus:ring-emerald-400">
                            <input type="number" id="edit-qtd-${itemChave}" value="${p.quantidade}" min="1" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-[11px] font-semibold text-center outline-none focus:ring-1 focus:ring-emerald-400">
                        </div>
                        <div class="flex justify-end gap-2 mt-2">
                            <button onclick="cancelarEdicao()" class="px-4 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-[10px] font-bold rounded-lg uppercase transition-colors">Cancelar</button>
                            <button onclick="salvarEdicao('${itemChave}')" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold rounded-lg uppercase shadow-sm transition-colors">Salvar Alterações</button>
                        </div>
                    </li>`;
                }

                const semanaHtml = p.semanaMes ? `<span class="text-[9px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded font-black uppercase border border-emerald-200">🗓️ ${p.semanaMes}</span>` : '';
                const nimbiHtml = p.codigoNimbi ? `<span class="text-[9px] bg-purple-50 text-purple-600 px-1.5 py-0.5 rounded font-bold uppercase border border-purple-100">Nimbi: ${p.codigoNimbi}</span>` : '';
                const movHtml = p.codigoMovimentacao ? `<span class="text-[9px] bg-amber-50 text-amber-600 px-1.5 py-0.5 rounded font-bold uppercase border border-amber-100">Mov: ${p.codigoMovimentacao}</span>` : '';
                const dataDesHtml = p.dataDesejada ? `<span class="text-[9px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold uppercase border border-blue-100">Para: ${p.dataDesejada.split('-').reverse().join('/')}</span>` : '';

                return `
                <li class="flex justify-between items-center p-4 hover:bg-slate-50 transition-colors border-b border-slate-50">
                    <div class="flex-1 pr-4">
                        <p class="text-sm font-bold text-slate-700 leading-tight">${p.nome}</p>
                        <div class="flex flex-wrap gap-2 items-center mt-1">
                            <span class="text-[9px] font-bold text-slate-500 bg-slate-200 px-1.5 py-0.5 rounded border border-slate-300">Cód: ${p.codigo || 'S/C'}</span>
                            <p class="text-[10px] text-slate-400 font-black uppercase tracking-tight">${p.quantidade} un x R$ ${p.valor}</p>
                            <span class="text-[9px] bg-orange-50 text-emerald-600 px-1.5 py-0.5 rounded font-bold uppercase border border-emerald-100">${p.local || 'Geral'}</span>
                            ${semanaHtml}
                            ${dataDesHtml}
                            ${nimbiHtml}
                            ${movHtml}
                        </div>
                    </div>
                    <div class="flex items-center gap-4 shrink-0">
                        <span class="text-sm font-black text-slate-800 tracking-tighter">R$ ${totalLinha.toFixed(2).replace('.', ',')}</span>
                        <div class="flex gap-1 bg-slate-100 rounded-lg p-1">
                            <button onclick="editar('${itemChave}')" class="p-1.5 text-emerald-500 hover:bg-emerald-200 hover:text-emerald-700 rounded-md font-bold text-xs transition-colors" title="Editar">✏️</button>
                            <button onclick="remover('${itemChave}')" class="p-1.5 text-red-400 hover:bg-red-200 hover:text-red-600 rounded-md font-bold text-xs transition-colors" title="Remover">✕</button>
                        </div>
                    </div>
                </li>`;
            }).join('');
            
            document.getElementById('totalPreco').innerText = `R$ ${somaTotalGlobal.toLocaleString('pt-br', { minimumFractionDigits: 2 })}`;
            validarLimite();
        }

        window.validarLimite = () => {
            const totalUI = document.getElementById('totalPreco');
            const alertaUI = document.getElementById('alertaLimite');
            if (somaTotalGlobal > valorLimiteDesteMes && valorLimiteDesteMes > 0) {
                totalUI.classList.add('ultrapassou');
                alertaUI.classList.remove('hidden');
            } else {
                totalUI.classList.remove('ultrapassou');
                alertaUI.classList.add('hidden');
            }
        };

        init();
    </script>
</body>
</html>
